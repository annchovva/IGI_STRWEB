<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ news.title }} - Автопарковка</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <header class="p-3 bg-dark text-white mb-5">
        <div class="container">
            <a href="{% url 'news_list' %}" class="text-white text-decoration-none fs-4">Назад к новостям</a>
        </div>
    </header>

    <div class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <article class="card shadow-sm border-0">
                    {% if news.image %}
                        <img src="{{ news.image.url }}" class="card-img-top" alt="{{ news.title }}">
                    {% endif %}
                    <div class="card-body p-5">
                        <h1 class="card-title mb-4">{{ news.title }}</h1>
                        <p class="text-muted small">Опубликовано: {{ news.published_at|date:"d/m/Y" }}</p>
                        <hr>
                        <div class="card-text fs-5" style="line-height: 1.6; white-space: pre-line;">
                            {{ news.content }}
                        </div>
                        <div class="mt-5">
                            <a href="{% url 'news_list' %}" class="btn btn-outline-secondary">← Ко всем новостям</a>
                        </div>
                    </div>
                </article>
            </div>
        </div>
    </div>
</body>
</html>
