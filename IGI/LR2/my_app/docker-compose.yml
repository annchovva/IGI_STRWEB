version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb_container
    ports:
      - "27017:27017"
    networks:
      - todo_network
    volumes:
      - mongodb_data:/data/db # ТОМ для сохранения данных

  backend:
    build: ./backend
    container_name: backend_container
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    networks:
      - todo_network

  frontend:
    build: ./frontend
    container_name: frontend_container
    ports:
      - "3000:3000"
    networks:
      - todo_network

# Описание сетей и томов
networks:
  todo_network:
    driver: bridge

volumes:
  mongodb_data:

